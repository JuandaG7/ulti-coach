<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas · Ulti Coach</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; background: #0f1d17; color: #f3ecdc; }
    h1 { font-size: 1.3rem; }
    li { margin: 6px 0; }
    .ok { color: #8cc7a0; }
    .fail { color: #ff8a7a; }
    small { display: block; color: #cfc8b4; }
  </style>
</head>
<body>
  <h1>Pruebas de Ulti Coach</h1>
  <p id="summary">Corriendo…</p>
  <ul id="list"></ul>
  <!-- Las vistas que se prueban importan sheet.js, que busca este diálogo al cargar. -->
  <dialog id="sheet" hidden><div class="sheet-body"></div></dialog>
  <script type="module">
    import { results as forehand } from "./forehand.test.js";
    import { results as angles } from "./angles.test.js";
    const results = [...forehand, ...angles];
    const failed = results.filter((r) => !r.ok).length;
    document.getElementById("summary").innerHTML = failed
      ? `<strong class="fail">${failed} de ${results.length} fallaron</strong>`
      : `<strong class="ok">Las ${results.length} pasaron</strong>`;
    document.getElementById("list").innerHTML = results
      .map((r) => `<li class="${r.ok ? "ok" : "fail"}">${r.ok ? "✓" : "✗"} ${r.name}${r.msg ? `<small>${r.msg}</small>` : ""}</li>`)
      .join("");
    window.testResults = results;
  </script>
</body>
</html>
