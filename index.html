<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ulti Coach</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#06140f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ulti Coach">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <span class="brand"><img class="brand-mark" src="icons/mark.svg" alt="" aria-hidden="true">ULTI COACH</span>
      <a class="profile-btn" href="#perfil" aria-label="Tu perfil"><span data-icon="user"></span></a>
    </div>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Secciones"></nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="sheet" class="sheet" aria-label="Detalle">
    <div class="sheet-body"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
