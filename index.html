<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ulti Coach</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ulti Coach">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <span class="brand"><span class="brand-mark" aria-hidden="true"></span>ULTI COACH</span>
      <a class="profile-btn" href="#perfil" aria-label="Tu perfil"><span data-icon="user"></span></a>
    </div>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Secciones">
      <a href="#inicio" data-tab="inicio"><span data-icon="home"></span><span>Inicio</span></a>
      <a href="#cuerpo" data-tab="cuerpo"><span data-icon="body"></span><span>Cuerpo</span></a>
      <a href="#blindaje" data-tab="blindaje"><span data-icon="shield"></span><span>Blindaje</span></a>
      <a href="#pruebas" data-tab="pruebas"><span data-icon="timer"></span><span>Pruebas</span></a>
      <a href="#video" data-tab="video"><span data-icon="video"></span><span>Video</span></a>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="sheet" class="sheet" aria-label="Detalle">
    <div class="sheet-body"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
